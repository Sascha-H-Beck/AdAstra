[project]
name = "adastra"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sascha Beck", email = "saschahbeck@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "requests[binary]>=2.34.2",
]

[project.scripts]
adastra = "adastra:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
